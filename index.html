<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Landing</title>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --neon-blue: #00ffff;
            --neon-purple: #ff00ff;
            --neon-pink: #ff00ff;
            --glass: rgba(255,255,255,0.1);
            --shadow: 0 0 20px var(--neon-blue);
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: #fff;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            width: 90%;
            max-width: 800px;
            padding: 2rem;
            background: var(--glass);
            border-radius: 20px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        h1 {
            font-size: 3rem;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: var(--shadow);
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px var(--neon-blue), 0 0 60px var(--neon-purple);
        }
        .glitch {
            position: relative;
        }
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 var(--neon-blue);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px;
            text-shadow: 2px 0 var(--neon-purple);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 2s infinite linear;
        }
        @keyframes glitch-anim {
            0% { clip: rect(44px, 450px, 56px, 0); }
            20% { clip: rect(48px, 450px, 52px, 0); }
            40% { clip: rect(50px, 450px, 50px, 0); }
            60% { clip: rect(48px, 450px, 52px, 0); }
            80% { clip: rect(46px, 450px, 54px, 0); }
            100% { clip: rect(47px, 450px, 53px, 0); }
        }
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="container">
        <h1 class="glitch" data-text="FUTURE IS NOW">FUTURE IS NOW</h1>
        <p>Welcome to the next generation of digital experiences. Explore what's possible when technology meets imagination.</p>
        <a href="#" class="btn">Get Started</a>
    </div>

    <script>
        // Generate stars
        const starsContainer = document.getElementById('stars');
        const starCount = 150;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = `${Math.random() * 3}px`;
            star.style.height = star.style.width;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.animationDelay = `${Math.random() * 5}s`;
            starsContainer.appendChild(star);
        }
    </script>
</body>
</html>
